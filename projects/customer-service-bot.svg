<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="nodeGradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ea4b71"/>
    </linearGradient>

    <linearGradient id="nodeGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="nodeGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="nodeGradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Patterns -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#gridPattern)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="250" cy="220" r="180" fill="#ff3366" opacity="0.08" filter="blur(60px)"/>
  <circle cx="650" cy="300" r="220" fill="#00f2fe" opacity="0.08" filter="blur(70px)"/>
  <circle cx="1020" cy="200" r="160" fill="#a855f7" opacity="0.08" filter="blur(50px)"/>

  <!-- Top App Navigation / Workflow Title Bar -->
  <g id="topbar">
    <rect x="30" y="24" width="1140" height="56" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#dropShadow)"/>
    
    <!-- n8n icon badge -->
    <rect x="48" y="36" width="32" height="32" rx="8" fill="url(#nodeGradPink)"/>
    <path d="M56 46 h16 M56 52 h10 M56 58 h16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="92" y="52" fill="#f8fafc" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="16">n8n Workflow • AI Customer Service Bot</text>
    <text x="92" y="68" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="12">Production Environment • Webhook + LLM Agent + HubSpot CRM + Telegram / Web</text>
    
    <!-- Status Badges -->
    <rect x="910" y="38" width="110" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="925" cy="52" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="936" y="56" fill="#34d399" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">Active Workflow</text>
    
    <!-- Latency Badge -->
    <rect x="1032" y="38" width="122" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="1046" y="56" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">⚡ 240ms Latency</text>
  </g>

  <!-- WORKFLOW CANVAS AREA (Left 740px) -->

  <!-- Curved Connection Wires -->
  <g id="wires" stroke-width="3" fill="none">
    <!-- Webhook to Validator -->
    <path d="M 180 200 C 230 200, 230 200, 280 200" stroke="url(#lineGrad1)"/>
    <!-- Validator to AI Agent Router -->
    <path d="M 440 200 C 490 200, 490 270, 530 270" stroke="url(#lineGrad1)"/>
    <!-- AI Agent to CRM Sync (Branch Up) -->
    <path d="M 690 260 C 730 260, 730 170, 770 170" stroke="url(#lineGrad2)"/>
    <!-- AI Agent to Response Formatter (Branch Mid) -->
    <path d="M 690 280 C 730 280, 730 330, 770 330" stroke="url(#lineGrad2)"/>
    <!-- AI Agent to Escalation Node (Branch Down) -->
    <path d="M 690 300 C 730 300, 730 460, 770 460" stroke="#f43f5e" stroke-dasharray="6,4"/>
    <!-- Response to Webhook Response -->
    <path d="M 930 330 C 970 330, 970 330, 1010 330" stroke="url(#lineGrad3)"/>
  </g>

  <!-- Glowing Wire Pulses -->
  <circle cx="230" cy="200" r="4" fill="#ff3366" filter="url(#glowPink)"/>
  <circle cx="485" cy="235" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
  <circle cx="730" cy="215" r="4" fill="#a855f7"/>
  <circle cx="730" cy="305" r="4" fill="#38bdf8"/>

  <!-- NODE 1: Webhook Intake -->
  <g id="node-webhook" filter="url(#dropShadow)">
    <rect x="40" y="155" width="140" height="90" rx="14" fill="url(#cardGrad)" stroke="#ff3366" stroke-width="1.8"/>
    <rect x="40" y="155" width="140" height="26" rx="14" fill="#ff3366" fill-opacity="0.15"/>
    <!-- Icon -->
    <circle cx="62" cy="188" r="14" fill="url(#nodeGradPink)"/>
    <text x="62" y="193" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">⚡</text>
    <!-- Label -->
    <text x="84" y="184" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">Webhook</text>
    <text x="84" y="198" fill="#fda4af" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="10">Chat Inbound</text>
    <text x="52" y="230" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">POST /v1/chat-bot</text>
    <!-- Connection Pin -->
    <circle cx="180" cy="200" r="5" fill="#ff3366" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- NODE 2: Payload Parser & Auth -->
  <g id="node-parser" filter="url(#dropShadow)">
    <rect x="280" y="155" width="160" height="90" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="280" y="155" width="160" height="26" rx="14" fill="#38bdf8" fill-opacity="0.15"/>
    <circle cx="304" cy="188" r="14" fill="url(#nodeGradCyan)"/>
    <text x="304" y="192" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">{;}</text>
    <text x="326" y="184" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">JSON Parser</text>
    <text x="326" y="198" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="10">Clean &amp; Validate</text>
    <text x="292" y="230" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Sanitize user input</text>
    <!-- Pins -->
    <circle cx="280" cy="200" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="440" cy="200" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- NODE 3: AI Agent Node (Hero Node) -->
  <g id="node-ai-agent" filter="url(#dropShadow)">
    <rect x="530" y="210" width="160" height="120" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="2.2"/>
    <rect x="530" y="210" width="160" height="30" rx="16" fill="url(#nodeGradPurple)" fill-opacity="0.25"/>
    <!-- Glowing outline -->
    <rect x="530" y="210" width="160" height="120" rx="16" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4" filter="url(#glowCyan)"/>
    <circle cx="558" cy="250" r="16" fill="url(#nodeGradPurple)"/>
    <text x="558" y="255" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">✦</text>
    <text x="582" y="246" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">AI Agent (LLM)</text>
    <text x="582" y="260" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="10">Gemini 1.5 Engine</text>
    <text x="544" y="286" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">• Intent Classifier</text>
    <text x="544" y="302" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">• Sentiment Analysis</text>
    <text x="544" y="318" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">• Knowledge RAG</text>
    <!-- Pins -->
    <circle cx="530" cy="270" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="690" cy="270" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- NODE 4: HubSpot CRM Sync -->
  <g id="node-crm" filter="url(#dropShadow)">
    <rect x="770" y="125" width="160" height="90" rx="14" fill="url(#cardGrad)" stroke="#ff7a59" stroke-width="1.8"/>
    <rect x="770" y="125" width="160" height="26" rx="14" fill="#ff7a59" fill-opacity="0.15"/>
    <circle cx="794" cy="158" r="14" fill="#ff7a59"/>
    <text x="794" y="162" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CRM</text>
    <text x="816" y="154" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">HubSpot API</text>
    <text x="816" y="168" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="10">Update Contact &amp; Log</text>
    <text x="782" y="200" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Sync conversation thread</text>
    <circle cx="770" cy="170" r="5" fill="#ff7a59" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- NODE 5: Response Formatter -->
  <g id="node-response" filter="url(#dropShadow)">
    <rect x="770" y="285" width="160" height="90" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8"/>
    <rect x="770" y="285" width="160" height="26" rx="14" fill="#10b981" fill-opacity="0.15"/>
    <circle cx="794" cy="318" r="14" fill="url(#nodeGradEmerald)"/>
    <text x="794" y="322" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
    <text x="816" y="314" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">Response Node</text>
    <text x="816" y="328" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="10">Markdown Formatter</text>
    <text x="782" y="360" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Deliver formatted reply</text>
    <circle cx="770" cy="330" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="930" cy="330" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- NODE 6: Webhook Outbound -->
  <g id="node-outbound" filter="url(#dropShadow)">
    <rect x="1010" y="285" width="145" height="90" rx="14" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.8"/>
    <rect x="1010" y="285" width="145" height="26" rx="14" fill="#06b6d4" fill-opacity="0.15"/>
    <circle cx="1034" cy="318" r="14" fill="url(#nodeGradCyan)"/>
    <text x="1034" y="322" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">💬</text>
    <text x="1056" y="314" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">Client Response</text>
    <text x="1056" y="328" fill="#cffafe" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="10">HTTP 200 OK</text>
    <text x="1022" y="360" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">JSON Output Ready</text>
    <circle cx="1010" cy="330" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- NODE 7: Human Escalation (Fallback) -->
  <g id="node-escalation" filter="url(#dropShadow)">
    <rect x="770" y="420" width="160" height="85" rx="14" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="794" cy="450" r="13" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="794" y="454" fill="#fda4af" font-size="11" font-weight="bold" text-anchor="middle">⚠️</text>
    <text x="816" y="446" fill="#fecdd3" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11.5">Human Fallback</text>
    <text x="816" y="460" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Slack / Live Agent Alert</text>
    <text x="782" y="488" fill="#fb7185" font-family="'Segoe UI', sans-serif" font-size="9">Triggered if sentiment &lt; -0.6</text>
    <circle cx="770" cy="460" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- BOTTOM PANELS: Live Execution Console & Chat Preview (Split Card) -->
  <!-- Left Side: Live Execution Payload Log -->
  <g id="json-panel" filter="url(#dropShadow)">
    <rect x="40" y="435" width="370" height="205" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="40" y="435" width="370" height="32" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <!-- Terminal dots -->
    <circle cx="58" cy="451" r="4.5" fill="#ef4444"/>
    <circle cx="72" cy="451" r="4.5" fill="#f59e0b"/>
    <circle cx="86" cy="451" r="4.5" fill="#10b981"/>
    <text x="105" y="455" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">execution-output.json</text>
    <text x="350" y="455" fill="#34d399" font-family="'Fira Code', monospace" font-size="10">● 200 OK</text>

    <!-- Code Lines -->
    <text x="56" y="485" fill="#64748b" font-family="'Fira Code', monospace" font-size="10.5">{</text>
    <text x="70" y="502" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">"session_id"<tspan fill="#94a3b8">: </tspan><tspan fill="#a7f3d0">"usr_99456"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="70" y="519" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">"intent"<tspan fill="#94a3b8">: </tspan><tspan fill="#a7f3d0">"order_inquiry"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="70" y="536" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">"crm_matched"<tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">true</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="70" y="553" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">"sentiment"<tspan fill="#94a3b8">: </tspan><tspan fill="#c084fc">"positive (+0.82)"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="70" y="570" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">"llm_response_time_ms"<tspan fill="#94a3b8">: </tspan><tspan fill="#f43f5e">240</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="70" y="587" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">"status"<tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">"resolved_automatically"</tspan></text>
    <text x="56" y="605" fill="#64748b" font-family="'Fira Code', monospace" font-size="10.5">}</text>
  </g>

  <!-- Right Side: Live Customer Chat Simulation -->
  <g id="chat-preview" filter="url(#dropShadow)">
    <rect x="430" y="435" width="725" height="205" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="430" y="435" width="725" height="32" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <text x="450" y="455" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700">⚡ Live Bot Preview (End-User Experience)</text>
    
    <!-- User Message -->
    <rect x="680" y="480" width="455" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="695" y="498" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11">Customer: "Hello! Can I check the delivery status of order #48291?"</text>
    <text x="695" y="513" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9.5">10:42 AM • WhatsApp Channel</text>

    <!-- Bot Response -->
    <rect x="450" y="534" width="685" height="66" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.4"/>
    <circle cx="472" cy="554" r="10" fill="url(#nodeGradPurple)"/>
    <text x="472" y="558" fill="#ffffff" font-size="10" text-anchor="middle">✦</text>
    <text x="490" y="554" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Aya's n8n AI Assistant:</text>
    <text x="490" y="572" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="11">"Hi there! Your order #48291 is currently out for delivery via Aramex. Expected arrival is today by 4:00 PM."</text>
    <text x="490" y="589" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="9.5">✓ Verified against HubSpot CRM Database • Synced with Ticket #TS-992</text>

    <!-- Metrics footer -->
    <text x="450" y="623" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Automation Pipeline: <tspan fill="#38bdf8">Webhook Trigger</tspan> → <tspan fill="#c084fc">Gemini AI Agent</tspan> → <tspan fill="#ff7a59">HubSpot CRM</tspan> → <tspan fill="#34d399">Instant Delivery</tspan></text>
  </g>
</svg>
