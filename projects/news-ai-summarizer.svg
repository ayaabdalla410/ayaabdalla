    <text x="760" y="160" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">Gemini 1.5 LLM</text>
    <text x="760" y="175" fill="#ddd6fe" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="10">Summarization Node</text>
    <text x="724" y="202" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">• 3-Bullet Abstractive</text>
    <text x="724" y="218" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">• 95% Word Reduction</text>
    <text x="724" y="234" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">• Sentiment &amp; Topic</text>
    <circle cx="710" cy="185" r="5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="880" cy="185" r="5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5"/>
