    <!-- Chip 3 -->
    <rect x="703" y="608" width="90" height="24" rx="12" fill="#451a03" stroke="#fbbf24" stroke-width="1"/>
    <text x="748" y="624" fill="#fde047" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">#PythonNLP</text>

    <!-- Chip 4 -->
    <rect x="801" y="608" width="85" height="24" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="843" y="624" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">#GeminiAI</text>

    <!-- Chip 5 -->
    <rect x="894" y="608" width="100" height="24" rx="12" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="944" y="624" fill="#fecdd3" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">#DataPipeline</text>

    <!-- Archive badge -->
