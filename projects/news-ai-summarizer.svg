    <text x="52" y="215" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Interval: 60 mins</text>
    <circle cx="180" cy="185" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  </g>

