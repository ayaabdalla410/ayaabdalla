    <circle cx="72" cy="441" r="4.5" fill="#f59e0b"/>
    <circle cx="86" cy="441" r="4.5" fill="#10b981"/>
    <text x="105" y="445" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="11" font-weight="600">sanitize_article.py (n8n Node)</text>
    <text x="390" y="445" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">Python 3</text>

    <!-- Code Lines -->
    <text x="56" y="475" fill="#c084fc" font-family="'Fira Code', monospace" font-size="10.5">import <tspan fill="#e2e8f0">re, json</tspan></text>
    <text x="56" y="493" fill="#c084fc" font-family="'Fira Code', monospace" font-size="10.5">from <tspan fill="#e2e8f0">bs4</tspan> import <tspan fill="#e2e8f0">BeautifulSoup</tspan></text>
    <text x="56" y="515" fill="#64748b" font-family="'Fira Code', monospace" font-size="10"># Clean scraped HTML and prepare payload</text>
    <text x="56" y="533" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">def <tspan fill="#fde047">clean_news_item</tspan>(raw_html):</text>
    <text x="75" y="551" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="10.5">soup = BeautifulSoup(raw_html, <tspan fill="#a7f3d0">'html.parser'</tspan>)</text>
    <text x="75" y="569" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="10.5">text = re.sub(<tspan fill="#a7f3d0">r'\s+'</tspan>, <tspan fill="#a7f3d0">' '</tspan>, soup.get_text())</text>
    <text x="75" y="587" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="10.5">return <tspan fill="#e2e8f0">{</tspan><tspan fill="#a7f3d0">"cleaned_text"</tspan><tspan fill="#e2e8f0">: text[:4000]}</tspan></text>
    
    <!-- Footer status -->
    <rect x="56" y="612" width="378" height="26" rx="8" fill="#131c2e"/>
    <text x="68" y="629" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10.5">⚡ Executed in 12ms • Memory: 18MB • Zero Errors</text>
  </g>

