    <!-- News Title -->
    <text x="490" y="478" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700">"Modern Workflow Automation &amp; AI Integration in 2026 Enterprises"</text>
    <text x="490" y="495" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Source: TechCrunch / RSS • Original length: 2,450 words → AI Summary: 78 words</text>

    <!-- AI 3-Bullet Summary Box -->
    <rect x="490" y="505" width="645" height="74" rx="10" fill="#0e1726" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="506" y="523" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">✦ AI Generated Bullet Summary:</text>
    <text x="506" y="541" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10.5">1. n8n workflows integrated with LLM agents eliminate 85% of manual data routing tasks.</text>
    <text x="506" y="557" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10.5">2. Python preprocessing nodes ensure clean JSON payloads before passing data to AI models.</text>
    <text x="506" y="571" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10.5">3. Automated keyword extraction categorizes articles for instant CRM &amp; database archiving.</text>

    <!-- Keywords Tag Chips -->
    <text x="490" y="600" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">EXTRACTED KEYWORDS &amp; TOPICS:</text>
    
    <!-- Chip 1 -->
    <rect x="490" y="608" width="92" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="536" y="624" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">#Automation</text>
    
    <!-- Chip 2 -->
