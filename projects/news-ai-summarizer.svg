  <circle cx="435" cy="185" r="4" fill="#fbbf24" filter="url(#glow2)"/>
  <circle cx="675" cy="185" r="4" fill="#8b5cf6" filter="url(#glow2)"/>
  <circle cx="915" cy="185" r="4" fill="#10b981" filter="url(#glow2)"/>

