    <path d="M54 48 h20 M54 53 h14 M54 58 h18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="92" y="52" fill="#f8fafc" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="16">n8n Workflow • News Aggregator, AI Summarizer &amp; Keyphrase Extractor</text>
    <text x="92" y="68" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="12">Scheduled Ingestion • Python Text Sanitizer • Gemini AI Summarization • NLP Keywords • Multi-Channel Delivery</text>
    
    <!-- Status Badges -->
    <rect x="915" y="38" width="115" height="28" rx="14" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <circle cx="930" cy="52" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="942" y="56" fill="#7dd3fc" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">Cron: 00 * * * *</text>
    
    <!-- Articles Counter -->
    <rect x="1040" y="38" width="114" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="1052" y="56" fill="#fde047" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11.5">⚡ 48 Articles/hr</text>
  </g>

  <!-- PIPELINE WORKFLOW (Top Canvas 330px) -->

  <!-- Curved Connection Wires -->
  <g id="wires2" stroke-width="3" fill="none">
