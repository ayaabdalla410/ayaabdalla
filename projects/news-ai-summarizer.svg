    <pattern id="dotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#334155" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>
  <rect width="1200" height="675" fill="url(#dotGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="200" cy="220" r="170" fill="#38bdf8" opacity="0.07" filter="blur(60px)"/>
  <circle cx="620" cy="200" r="210" fill="#8b5cf6" opacity="0.08" filter="blur(70px)"/>
  <circle cx="1000" cy="300" r="190" fill="#10b981" opacity="0.07" filter="blur(60px)"/>

